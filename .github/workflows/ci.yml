name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: flake8 .
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ci-practice:${{ github.sha }} .
      - run: docker run ci-practice:${{ github.sha }}
      - run: |
          echo "Secret is: $MY_SECRET"
          echo "Secret length: ${#MY_SECRET}"
          echo "Wrong name is: '$WRONG_ONE'"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
          WRONG_ONE: ${{ secrets.DOES_NOT_EXIST }}